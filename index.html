<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shivam Deals</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  margin-bottom:15px;
}

#search{
  width:90%;
  max-width:600px;
  padding:12px;
  border:0;
  border-radius:8px;
  font-size:16px;
}

nav{
  background:white;
  padding:12px;
  text-align:center;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

nav button{
  padding:9px 14px;
  border:0;
  border-radius:6px;
  cursor:pointer;
  background:#e5e7eb;
  font-weight:500;
}

nav button.active{
  background:#111827;
  color:white;
}

.container{
  width:94%;
  max-width:1200px;
  margin:25px auto;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 2px 10px #ddd;
  position:relative;
}

.card img{
  width:100%;
  height:220px;
  object-fit:contain;
}

.card h3{
  margin:10px 0 6px;
  font-size:16px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
  color:#111;
}

.buy{
  display:block;
  text-align:center;
  background:#ff9900;
  color:#111;
  text-decoration:none;
  padding:11px;
  border-radius:7px;
  font-weight:bold;
  margin-top:10px;
}

.admin{
  background:white;
  padding:20px;
  margin-bottom:25px;
  border-radius:12px;
  display:none; /* pehle hidden rahega */
}

.admin input,
.admin select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:7px;
}

.admin button{
  padding:12px 20px;
  background:#111827;
  color:white;
  border:0;
  border-radius:7px;
  cursor:pointer;
  margin-top:8px;
}

.delete-btn{
  background:#dc2626;
  color:white;
  border:0;
  padding:7px 12px;
  margin-top:10px;
  border-radius:5px;
  cursor:pointer;
  font-size:13px;
  width:100%;
}

#loginBox{
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:12px;
  text-align:center;
}

#loginBox input{
  padding:10px;
  width:200px;
  border:1px solid #ccc;
  border-radius:6px;
  margin-right:8px;
}

footer{
  background:#111827;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:40px;
}

#message{
  margin-top:12px;
  font-weight:500;
}
</style>
</head>

<body>

<header>
  <h1>🛒 Shivam Deals</h1>
  <input id="search" placeholder="Product search kare..." oninput="loadProducts()">
</header>

<nav>
  <button onclick="filterCategory('All')" class="active">All Products</button>
  <button onclick="filterCategory('Mobile')">Mobile</button>
  <button onclick="filterCategory('Electronics')">Electronics</button>
  <button onclick="filterCategory('Fashion')">Fashion</button>
  <button onclick="filterCategory('Home')">Home & Kitchen</button>
</nav>

<div class="container">

  <!-- Login Box (Admin ke liye) -->
  <div id="loginBox">
    <h3>🔐 Admin Login</h3>
    <br>
    <input type="password" id="adminPass" placeholder="Password daalo">
    <button onclick="checkLogin()">Login</button>
    <p id="loginMsg" style="margin-top:10px;color:red;"></p>
  </div>

  <!-- Admin Panel (sirf login ke baad dikhega) -->
  <div class="admin" id="adminPanel">
    <h2>➕ New Product Add Kare</h2>

    <input id="name" placeholder="Product Name">
    <input id="price" placeholder="Price (jaise ₹1499)">
    
    <select id="category">
      <option value="Mobile">Mobile</option>
      <option value="Electronics">Electronics</option>
      <option value="Fashion">Fashion</option>
      <option value="Home">Home & Kitchen</option>
      <option value="Other">Other</option>
    </select>

    <input id="amazon" placeholder="Amazon Affiliate Link">
    <input id="photo" type="file" accept="image/*">

    <button onclick="addProduct()">Product Add Kare</button>
    <p id="message"></p>
  </div>

  <h2>🛍️ All Products</h2>
  <br>
  <div class="products" id="products"></div>
</div>

<footer>
  © 2026 Shivam Deals
</footer>

<script>
/* ====================== SUPABASE DETAILS ====================== */
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";     // yahan daalo
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";        // yahan daalo

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ====================== ADMIN PASSWORD ====================== */
const ADMIN_PASSWORD = "shivam123";   // apna password change kar lo

let currentCategory = "All";
let isAdmin = false;

/* ====================== LOGIN ====================== */
function checkLogin() {
  const pass = document.getElementById("adminPass").value;
  const msg = document.getElementById("loginMsg");

  if (pass === ADMIN_PASSWORD) {
    isAdmin = true;
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    loadProducts(); // delete button dikhane ke liye
  } else {
    msg.innerText = "Galat password!";
  }
}

/* ====================== ADD PRODUCT ====================== */
async function addProduct() {
  const name = document.getElementById("name").value.trim();
  const price = document.getElementById("price").value.trim();
  const category = document.getElementById("category").value;
  const amazon = document.getElementById("amazon").value.trim();
  const file = document.getElementById("photo").files[0];
  const message = document.getElementById("message");

  if (!name || !amazon) {
    message.innerText = "Product name aur Amazon link daalo.";
    message.style.color = "red";
    return;
  }

  let imageUrl = "";

  if (file) {
    const fileName = Date.now() + "-" + file.name;

    const { error } = await supabaseClient
      .storage
      .from("product-images")
      .upload(fileName, file);

    if (error) {
      message.innerText = "Photo upload nahi hui: " + error.message;
      message.style.color = "red";
      return;
    }

    const { data } = supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(fileName);

    imageUrl = data.publicUrl;
  }

  const { error } = await supabaseClient
    .from("products")
    .insert({
      name: name,
      price: price,
      category: category,
      image_url: imageUrl,
      amazon_url: amazon
    });

  if (error) {
    message.innerText = "Product add nahi hua: " + error.message;
    message.style.color = "red";
    return;
  }

  message.innerText = "✅ Product successfully add ho gaya!";
  message.style.color = "green";

  // form clear
  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("amazon").value = "";
  document.getElementById("photo").value = "";

  loadProducts();
}

/* ====================== DELETE PRODUCT ====================== */
async function deleteProduct(id) {
  if (!confirm("Kya aap sach mein delete karna chahte ho?")) return;

  const { error } = await supabaseClient
    .from("products")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Delete nahi hua: " + error.message);
    return;
  }

  loadProducts();
}

/* ====================== FILTER ====================== */
function filterCategory(category) {
  currentCategory = category;

  // active button highlight
  document.querySelectorAll("nav button").forEach(btn => {
    btn.classList.remove("active");
    if (btn.innerText.includes(category) || (category === "All" && btn.innerText.includes("All"))) {
      btn.classList.add("active");
    }
  });

  loadProducts();
}

/* ====================== LOAD PRODUCTS ====================== */
async function loadProducts() {
  const search = document.getElementById("search").value.toLowerCase();

  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    document.getElementById("products").innerHTML = "<p>Products load nahi hue. Supabase check karo.</p>";
    return;
  }

  let list = data || [];

  if (currentCategory !== "All") {
    list = list.filter(p => p.category === currentCategory);
  }

  if (search) {
    list = list.filter(p => p.name.toLowerCase().includes(search));
  }

  const box = document.getElementById("products");
  box.innerHTML = "";

  if (list.length === 0) {
    box.innerHTML = "<p>Koi product nahi mila.</p>";
    return;
  }

  list.forEach(p => {
    box.innerHTML += `
      <div class="card">
        \( {p.image_url ? `<img src=" \){p.image_url}" alt="${p.name}">` : ""}
        <h3>${p.name}</h3>
        <div class="price">${p.price || ""}</div>
        <a class="buy" href="${p.amazon_url}" target="_blank" rel="nofollow sponsored noopener">
          🛒 Buy on Amazon
        </a>
        \( {isAdmin ? `<button class="delete-btn" onclick="deleteProduct( \){p.id})">🗑️ Delete</button>` : ""}
      </div>
    `;
  });
}

// pehli baar load
loadProducts();
</script>

</body>
