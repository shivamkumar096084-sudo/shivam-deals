<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shivam Deals</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f4f6;
    color:#111827;
}

/* HEADER */
header{
    background:#111827;
    color:white;
    text-align:center;
    padding:35px 15px;
}

.logo{
    font-size:42px;
    font-weight:bold;
    margin-bottom:25px;
}

.search{
    width:92%;
    max-width:600px;
    padding:17px;
    border:none;
    border-radius:14px;
    font-size:18px;
}

/* CATEGORY BUTTONS */
.categories{
    background:white;
    padding:22px 10px;
    text-align:center;
}

.categories button{
    border:none;
    padding:14px 22px;
    margin:5px;
    border-radius:12px;
    background:#e5e7eb;
    font-size:16px;
    cursor:pointer;
}

.categories button.active{
    background:#111827;
    color:white;
}

/* ADMIN */
.admin-box{
    width:94%;
    max-width:650px;
    margin:30px auto;
    padding:28px;
    background:white;
    border-radius:20px;
    box-shadow:0 4px 15px #0001;
}

.admin-title{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:20px;
}

.input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.btn{
    border:none;
    border-radius:9px;
    padding:13px 18px;
    background:#111827;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:8px;
}

.logout{
    background:#dc2626;
}

#adminPanel{
    display:none;
}

.message{
    text-align:center;
    margin-top:12px;
    font-weight:bold;
}

/* PRODUCT AREA */
.products-section{
    width:94%;
    max-width:1200px;
    margin:35px auto;
}

.section-title{
    font-size:32px;
    margin:30px 0 18px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.product{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 15px #0001;
    padding-bottom:15px;
}

.product img{
    width:100%;
    height:220px;
    object-fit:contain;
    background:white;
}

.product-info{
    padding:15px;
}

.product-name{
    font-size:19px;
    font-weight:bold;
    margin-bottom:10px;
}

.price{
    font-size:22px;
    font-weight:bold;
    margin-bottom:12px;
}

.buy{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#ff9900;
    color:#111;
    padding:13px;
    border-radius:8px;
    font-weight:bold;
    margin-bottom:8px;
}

.delete{
    width:100%;
    background:#dc2626;
}

.empty{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    color:#666;
}

/* FOOTER */
footer{
    margin-top:60px;
    padding:40px 15px;
    background:#111827;
    color:white;
    text-align:center;
    font-size:18px;
}

/* MOBILE */
@media(max-width:600px){

    .logo{
        font-size:34px;
    }

    .admin-title{
        font-size:26px;
    }

    .section-title{
        font-size:27px;
    }

    .product img{
        height:200px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>

    <div class="logo">
        🛒 Shivam Deals
    </div>

    <input
        id="search"
        class="search"
        type="text"
        placeholder="Product search kare..."
        oninput="showProducts()"
    >

</header>


<!-- CATEGORY BUTTONS -->
<div class="categories">

    <button
        class="active"
        onclick="selectCategory('All',this)">
        All Products
    </button>

    <button
        onclick="selectCategory('Mobile',this)">
        Mobile
    </button>

    <button
        onclick="selectCategory('Electronics',this)">
        Electronics
    </button>

    <button
        onclick="selectCategory('Fashion',this)">
        Fashion
    </button>

    <button
        onclick="selectCategory('Home & Kitchen',this)">
        Home & Kitchen
    </button>

</div>


<!-- ADMIN LOGIN -->
<div class="admin-box">

    <div class="admin-title">
        🔐 Admin Login
    </div>

    <!-- LOGIN -->
    <div id="loginArea">

        <input
            id="password"
            class="input"
            type="password"
            placeholder="Password daalo"
        >

        <button
            class="btn"
            onclick="login()">
            Login
        </button>

        <div
            id="loginMessage"
            class="message">
        </div>

    </div>


    <!-- ADMIN PANEL -->
    <div id="adminPanel">

        <h2>➕ Product Add Kare</h2>

        <input
            id="productName"
            class="input"
            placeholder="Product name"
        >

        <input
            id="productPrice"
            class="input"
            type="number"
            placeholder="Price ₹"
        >

        <input
            id="productImage"
            class="input"
            placeholder="Product photo URL"
        >

        <input
            id="productLink"
            class="input"
            placeholder="Amazon Buy Link"
        >

        <!-- CATEGORY -->
        <select
            id="productCategory"
            class="input">

            <option value="Mobile">
                Mobile
            </option>

            <option value="Electronics">
                Electronics
            </option>

            <option value="Fashion">
                Fashion
            </option>

            <option value="Home & Kitchen">
                Home & Kitchen
            </option>

        </select>

        <button
            class="btn"
            onclick="addProduct()">
            ➕ Product Add Kare
        </button>

        <button
            class="btn logout"
            onclick="logout()">
            Logout
        </button>

        <div
            id="adminMessage"
            class="message">
        </div>

    </div>

</div>


<!-- PRODUCTS -->
<div
    id="productsArea"
    class="products-section">
</div>


<footer>
    © 2026 Shivam Deals
</footer>


<script>

/* ADMIN PASSWORD */

const ADMIN_PASSWORD = "1234";


/* CURRENT CATEGORY */

let currentCategory = "All";


/* PRODUCTS */

let products =
JSON.parse(
    localStorage.getItem("shivamDealsProducts")
) || [];


/* LOGIN */

function login(){

    let password =
        document.getElementById("password").value;

    let message =
        document.getElementById("loginMessage");

    if(password === ADMIN_PASSWORD){

        document.getElementById("loginArea")
        .style.display = "none";

        document.getElementById("adminPanel")
        .style.display = "block";

        message.innerHTML = "";

    }else{

        message.innerHTML =
            "❌ Password galat hai";

        message.style.color = "red";
    }
}


/* LOGOUT */

function logout(){

    document.getElementById("loginArea")
    .style.display = "block";

    document.getElementById("adminPanel")
    .style.display = "none";

    document.getElementById("password").value = "";
}


/* CATEGORY SELECT */

function selectCategory(category,button){

    currentCategory = category;

    document
    .querySelectorAll(".categories button")
    .forEach(btn => {

        btn.classList.remove("active");

    });

    button.classList.add("active");

    showProducts();
}


/* ADD PRODUCT */

function addProduct(){

    let name =
        document.getElementById("productName")
        .value.trim();

    let price =
        document.getElementById("productPrice")
        .value.trim();

    let image =
        document.getElementById("productImage")
        .value.trim();

    let link =
        document.getElementById("productLink")
        .value.trim();

    let category =
        document.getElementById("productCategory")
        .value;

    let message =
        document.getElementById("adminMessage");


    if(
        !name ||
        !price ||
        !image ||
        !link
    ){

        message.innerHTML =
            "❌ Sabhi details bhariye";

        message.style.color = "red";

        return;
    }


    /* NEW PRODUCT */

    let product = {

        id: Date.now(),

        name: name,

        price: price,

        image: image,

        link: link,

        category: category

    };


    /* PRODUCT ADD */

    products.unshift(product);


    /* SAVE */

    localStorage.setItem(
        "shivamDealsProducts",
        JSON.stringify(products)
    );


    /* CLEAR */

    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productImage").value = "";
    document.getElementById("productLink").value = "";


    message.innerHTML =
        "✅ Product add ho gaya";

    message.style.color = "green";


    showProducts();
}


/* DELETE PRODUCT */

function deleteProduct(id){

    if(
        !confirm(
            "Kya aap ye product delete karna chahte hain?"
        )
    ){

        return;
    }


    products =
        products.filter(
            product => product.id !== id
        );


    localStorage.setItem(
        "shivamDealsProducts",
        JSON.stringify(products)
    );


    showProducts();
}


/* SHOW ONE PRODUCT */

function productHTML(product){

    return `

    <div class="product">

        <img
            src="${product.image}"
            alt="${product.name}"
            onerror="
            this.src=
            'https://via.placeholder.com/500x500?text=No+Image'
            "
        >

        <div class="product-info">

            <div class="product-name">
                ${product.name}
            </div>

            <div class="price">
                ₹${product.price}
            </div>

            <a
                class="buy"
                href="${product.link}"
                target="_blank"
                rel="noopener">
                🛒 Buy Now
            </a>

            <button
                class="btn delete"
                onclick="
                deleteProduct(${product.id})
                ">
                🗑️ Delete
            </button>

        </div>

    </div>

    `;
}


/* SHOW PRODUCTS */

function showProducts(){

    let area =
        document.getElementById("productsArea");

    let search =
        document.getElementById("search")
        .value
        .toLowerCase();


    /* ALL PRODUCTS */

    if(currentCategory === "All"){

        let filtered =
            products.filter(product =>

                product.name
                .toLowerCase()
                .includes(search)

            );


        let html = `

        <h1 class="section-title">
            🛍️ All Products
        </h1>

        <div class="product-grid">
        `;


        if(filtered.length === 0){

            html += `
                <div class="empty">
                    अभी कोई Product नहीं है
                </div>
            `;

        }else{

            filtered.forEach(product => {

                html += productHTML(product);

            });

        }


        html += `
        </div>
        `;


        /* CATEGORY SECTIONS */

        let categories = [
            "Mobile",
            "Electronics",
            "Fashion",
            "Home & Kitchen"
        ];


        categories.forEach(category => {

            let categoryProducts =
                products.filter(product =>

                    product.category === category &&
                    product.name
                    .toLowerCase()
                    .includes(search)

                );


            if(categoryProducts.length > 0){

                html += `

                <h1 class="section-title">
                    ${
                        category === "Mobile"
                        ? "📱"
                        : category === "Electronics"
                        ? "🎧"
                        : category === "Fashion"
                        ? "👕"
                        : "🏠"
                    }

                    ${category}
                </h1>

                <div class="product-grid">
                `;


                categoryProducts.forEach(product => {

                    html += productHTML(product);

                });


                html += `
                </div>
                `;

            }

        });


        area.innerHTML = html;

        return;
    }


    /* SPECIFIC CATEGORY */

    let filtered =
        products.filter(product =>

            product.category === currentCategory &&

            product.name
            .toLowerCase()
            .includes(search)

        );


    let icon =
        currentCategory === "Mobile"
        ? "📱"
        : currentCategory === "Electronics"
        ? "🎧"
        : currentCategory === "Fashion"
        ? "👕"
        : "🏠";


    let html = `

    <h1 class="section-title">
        ${icon} ${currentCategory}
    </h1>

    <div class="product-grid">
    `;


    if(filtered.length === 0){

        html += `
            <div class="empty">
                इस Category में अभी कोई Product नहीं है
            </div>
        `;

    }else{

        filtered.forEach(product => {

            html += productHTML(product);

        });

    }


    html += `
    </div>
    `;


    area.innerHTML = html;
}


/* START */

showProducts();

</script>

</body>
  </html>
